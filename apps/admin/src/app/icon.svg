<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Фавикон админки. Тема приложения нейтрально-серая, поэтому иконка
    намеренно цветная: в полосе из десятка вкладок нужную находят по пятну
    цвета, а серый квадрат сливается с остальными.

    Форма — «искра»: общепринятый знак сгенерированной картинки. Одна
    крупная фигура без мелких деталей, потому что реальный размер 16 px.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#g)"/>
  <path d="M16 5.5c.62 5.62 4.88 9.88 10.5 10.5-5.62.62-9.88 4.88-10.5 10.5C15.38 20.88 11.12 16.62 5.5 16c5.62-.62 9.88-4.88 10.5-10.5Z" fill="#fff"/>
</svg>
