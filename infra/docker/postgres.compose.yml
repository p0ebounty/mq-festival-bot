# Общий PostgreSQL для обоих стендов: базы mqbot_dev и mqbot_prod.
# Слушает ТОЛЬКО 127.0.0.1 — наружу порт не публикуется.
name: mqbot-postgres

services:
  postgres:
    image: postgres:16-alpine
    container_name: mqbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mqbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: mqbot_dev
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mqbot-pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mqbot -d mqbot_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mqbot-pgdata:
